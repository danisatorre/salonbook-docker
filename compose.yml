services:

  mongo:
    build: ./mongo
    image: ghcr.io/danisatorre/salonbook-mongo:1.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?Falta MONGO_USER en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Falta MONGO_PASSWORD en .env}
    volumes:
      - datos-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build: .
    image: ghcr.io/danisatorre/salonbook-app:1.0
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGODB_URL: mongo:27017/salonbook?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  datos-mongo:
